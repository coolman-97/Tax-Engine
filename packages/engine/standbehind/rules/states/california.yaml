# California. The state that matters most to an LA-based advisor, and the one
# with the two traps everyone forgets.
code: CA
name: California
citation: "Cal. Rev. & Tax. Code; FTB 2025 tax rate schedules"

# Trap 1: California has no preferential capital gains rate. Gain is ordinary
# income, taxed up to 13.3%. A hold/sell comparison that applies a 20% federal
# LTCG rate and forgets the state is off by a lot in this state.
taxes_capital_gains_as_ordinary: true

# Trap 2: California conforms to section 1031, but does not let go. Exchange a
# California property into an out-of-state replacement and the deferred
# California-source gain follows you: FTB Form 3840 must be filed every year
# for as long as the gain stays deferred, and California taxes it when it is
# finally recognised - regardless of where you live or where the property is
# by then.
conforms_to_section_1031: true
clawback_on_out_of_state_exchange: true
clawback_form: "FTB 3840"

# California has never conformed to federal bonus depreciation, so a cost
# segregation study that wipes out federal taxable income leaves the state
# return largely untouched. Modelling them as one number is wrong.
conforms_to_bonus_depreciation: false

additional_surtax:
  # Mental Health Services Tax, Prop 63. 1% over $1,000,000 - and the
  # threshold is NOT doubled for joint filers, which is the detail that
  # surprises people. 12.3% + 1% is where the famous 13.3% comes from.
  rate: "0.01"
  threshold: 1000000

